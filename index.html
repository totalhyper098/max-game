<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameVault</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<!-- Header -->

<header>

<div class="logo">
🎮
</div>

<div>
<h1>GameVault</h1>
<p>Classic Board Games</p>
</div>

<button>
🔔
</button>

</header>



<!-- Home -->

<section class="home">

<div class="hero">

<h2>Play Classic Games</h2>

<p>
Carrom, Ludo, Chess and more board games in one place.
</p>

<button class="play">
Start Playing
</button>

</div>



<h3>Popular Games</h3>


<div class="games">


<div class="card" onclick="openGame('carrom')">

<div class="icon">
⚪
</div>

<h2>Carrom</h2>

<p>
Multiplayer • AI • Offline
</p>

</div>



<div class="card" onclick="openGame('ludo')">

<div class="icon">
🎲
</div>

<h2>Ludo</h2>

<p>
2-4 Players • Online
</p>

</div>



<div class="card" onclick="openGame('chess')">

<div class="icon">
♟️
</div>

<h2>Chess</h2>

<p>
Strategy • AI
</p>

</div>



<div class="card" onclick="openGame('pool')">

<div class="icon">
🎱
</div>

<h2>Pool</h2>

<p>
8 Ball Pool
</p>

</div>


</div>


</section>



<!-- Bottom Navigation -->


<nav>

<button>
🏠
<span>Home</span>
</button>


<button>
🎮
<span>Games</span>
</button>


<button>
🎁
<span>Rewards</span>
</button>


<button>
👤
<span>Profile</span>
</button>


</nav>



</div>


<script src="script.js"></script>

</body>
</html>
