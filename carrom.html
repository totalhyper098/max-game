<script>
  // ==============================
  // MODE SELECTION
  // ==============================

  function toggleOptions(id) {
    const box = document.getElementById(id);

    document.querySelectorAll(".options").forEach(option => {
      if (option !== box) {
        option.classList.remove("show");
      }
    });

    box.classList.toggle("show");
  }


  // ==============================
  // AI OPTIONS
  // ==============================

  document.querySelectorAll("#aiOptions .option-btn").forEach((button, index) => {

    button.addEventListener("click", function () {

      const aiCount = index + 1;

      localStorage.setItem("carromMode", "ai");
      localStorage.setItem("carromPlayers", String(aiCount));

      // Open difficulty selection
      showDifficulty(aiCount);
    });

  });


  // ==============================
  // DIFFICULTY SELECTION
  // ==============================

  function showDifficulty(aiCount) {

    const existing = document.getElementById("difficultyOptions");

    if (existing) {
      existing.remove();
    }

    const difficultyBox = document.createElement("div");

    difficultyBox.id = "difficultyOptions";
    difficultyBox.className = "options show";

    difficultyBox.innerHTML = `
      <div class="options-title">
        ${aiCount} AI ${aiCount === 1 ? "OPPONENT" : "OPPONENTS"} — DIFFICULTY
      </div>

      <div class="option-grid">
        <button class="option-btn difficulty-btn" data-difficulty="easy">
          Easy
        </button>

        <button class="option-btn difficulty-btn" data-difficulty="medium">
          Medium
        </button>

        <button class="option-btn difficulty-btn" data-difficulty="hard">
          Hard
        </button>
      </div>
    `;

    document.getElementById("aiOptions").after(difficultyBox);

    difficultyBox
      .querySelectorAll(".difficulty-btn")
      .forEach(button => {

        button.addEventListener("click", function () {

          const difficulty = this.dataset.difficulty;

          localStorage.setItem(
            "carromDifficulty",
            difficulty
          );

          startCarromGame();
        });

      });
  }


  // ==============================
  // LOCAL MULTIPLAYER
  // ==============================

  document
    .querySelectorAll("#localOptions .option-btn")
    .forEach((button, index) => {

      button.addEventListener("click", function () {

        const players = index + 2;

        localStorage.setItem(
          "carromMode",
          "local"
        );

        localStorage.setItem(
          "carromPlayers",
          String(players)
        );

        startCarromGame();
      });

    });


  // ==============================
  // START GAME
  // ==============================

  function startCarromGame() {

    /*
      For now we save the selected configuration.

      The next step will be the actual
      Carrom board/game engine.
    */

    const mode =
      localStorage.getItem("carromMode");

    const players =
      localStorage.getItem("carromPlayers");

    const difficulty =
      localStorage.getItem("carromDifficulty");

    console.log("CARROM GAME CONFIG", {
      mode,
      players,
      difficulty
    });

    /*
      Temporary screen.
      We will replace this with the
      real Carrom board next.
    */

    document.querySelector(".carrom-page").innerHTML = `

      <header class="carrom-header">

        <a class="back-btn" href="carrom.html">
          ← Back
        </a>

        <div class="xi-balance">
          <span class="xi-icon">XI</span>
          <strong>0</strong>
        </div>

      </header>

      <section style="
        min-height:70vh;
        display:grid;
        place-items:center;
        text-align:center;
      ">

        <div>

          <div style="
            font-size:70px;
            margin-bottom:20px;
          ">
            🎯
          </div>

          <h1 style="
            font-size:42px;
            margin-bottom:12px;
          ">
            CARROM READY
          </h1>

          <p style="
            color:#9aa89f;
            line-height:1.7;
          ">
            Mode: ${mode}<br>
            Players: ${players}
            ${difficulty ? `<br>Difficulty: ${difficulty}` : ""}
          </p>

          <button
            id="realGameButton"
            class="back-btn"
            style="
              margin-top:25px;
              border:0;
              background:#b8ff3d;
              color:#07120d;
            "
          >
            START CARROM
          </button>

        </div>

      </section>
    `;

    document
      .getElementById("realGameButton")
      .addEventListener("click", createCarromBoard);

  }


  // ==============================
  // TEMPORARY BOARD
  // ==============================

  function createCarromBoard() {

    document.querySelector(".carrom-page").innerHTML = `

      <header class="carrom-header">

        <button
          class="back-btn"
          onclick="location.reload()"
        >
          ← Back
        </button>

        <div class="xi-balance">
          <span class="xi-icon">XI</span>
          <strong>0</strong>
        </div>

      </header>

      <section style="text-align:center;">

        <h1 style="
          font-size:36px;
          margin-bottom:20px;
        ">
          CARROM BOARD
        </h1>

        <div id="gameBoard" style="
          position:relative;
          width:min(92vw,520px);
          aspect-ratio:1;
          margin:auto;

          border:14px solid #4a2813;
          border-radius:20px;

          background:
            linear-gradient(
              135deg,
              #d49a52,
              #a9632e
            );

          box-shadow:
            inset 0 0 0 5px #e0ad68,
            0 25px 60px rgba(0,0,0,.5);
        ">

          <div class="game-pocket" style="top:12px;left:12px"></div>
          <div class="game-pocket" style="top:12px;right:12px"></div>
          <div class="game-pocket" style="bottom:12px;left:12px"></div>
          <div class="game-pocket" style="bottom:12px;right:12px"></div>

          <div style="
            position:absolute;
            inset:35px;
            border:2px solid rgba(80,40,15,.65);
          "></div>

          <div id="pieces" style="
            position:absolute;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:7px;
          ">

            <span class="game-piece black-piece"></span>
            <span class="game-piece white-piece"></span>
            <span class="game-piece queen-piece"></span>
            <span class="game-piece white-piece"></span>
            <span class="game-piece black-piece"></span>

          </div>

          <div id="striker" style="
            position:absolute;
            bottom:35px;
            left:50%;
            transform:translateX(-50%);

            width:34px;
            height:34px;

            border-radius:50%;

            background:#f4eee0;

            border:3px solid #6b4b2d;

            box-shadow:
              0 4px 8px rgba(0,0,0,.4);

            touch-action:none;
          "></div>

        </div>

        <div style="
          margin-top:20px;
          color:#9aa89f;
        ">
          Drag the striker to aim.
        </div>

      </section>
    `;

    addBoardStyles();
  }


  // ==============================
  // BOARD STYLES
  // ==============================

  function addBoardStyles() {

    const style = document.createElement("style");

    style.textContent = `

      .game-pocket {
        position:absolute;
        width:32px;
        height:32px;
        border-radius:50%;
        background:#130b06;
        box-shadow:inset 0 3px 6px rgba(255,255,255,.08);
      }

      .game-piece {
        width:25px;
        height:25px;
        border-radius:50%;
        box-shadow:
          inset 2px 2px 4px rgba(255,255,255,.3),
          2px 4px 7px rgba(0,0,0,.4);
      }

      .black-piece {
        background:#171717;
      }

      .white-piece {
        background:#eee6d8;
      }

      .queen-piece {
        background:#d94b58;
      }

    `;

    document.head.appendChild(style);
  }
</script>
