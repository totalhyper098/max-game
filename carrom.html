<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07120d">

  <title>MAXGAME — Carrom</title>

  <link rel="stylesheet" href="css/styles.css">

  <style>
    .carrom-page {
      min-height: 100vh;
      padding: 24px 18px 110px;
    }

    .carrom-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .back-btn {
      text-decoration: none;
      color: #f5f7f4;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 700;
    }

    .xi-balance {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
    }

    .xi-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #b8ff3d;
      color: #07120d;
      font-weight: 900;
    }

    .carrom-title {
      margin-bottom: 22px;
    }

    .carrom-title h1 {
      font-size: clamp(42px, 12vw, 70px);
      line-height: .9;
      margin: 10px 0;
      letter-spacing: -3px;
    }

    .carrom-title h1 span {
      color: #b8ff3d;
    }

    .carrom-title p {
      color: #9aa89f;
      line-height: 1.6;
      margin: 0;
    }

    .board-preview {
      position: relative;
      min-height: 260px;
      margin: 25px 0;
      border-radius: 26px;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.08), transparent 35%),
        linear-gradient(135deg, #9b5e27, #5a3015);
      border: 7px solid #2b160b;
      box-shadow:
        inset 0 0 0 5px #c58a45,
        0 20px 50px rgba(0,0,0,.35);
    }

    .pocket {
      position: absolute;
      width: 34px;
      height: 34px;
      background: #100b07;
      border-radius: 50%;
      box-shadow: inset 0 2px 5px rgba(255,255,255,.1);
    }

    .p1 { top: 12px; left: 12px; }
    .p2 { top: 12px; right: 12px; }
    .p3 { bottom: 12px; left: 12px; }
    .p4 { bottom: 12px; right: 12px; }

    .coins {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .coin-piece {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      box-shadow: 0 3px 7px rgba(0,0,0,.4);
    }

    .black { background: #171717; }
    .white { background: #f0e9dc; }
    .queen { background: #d94b58; }

    .mode-section h2 {
      font-size: 20px;
      margin: 25px 0 14px;
    }

    .mode-grid {
      display: grid;
      gap: 12px;
    }

    .mode-card {
      width: 100%;
      text-align: left;
      padding: 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.045);
      color: #f5f7f4;
      cursor: pointer;
      transition: .2s ease;
    }

    .mode-card:active {
      transform: scale(.98);
    }

    .mode-card:hover {
      border-color: rgba(184,255,61,.4);
      background: rgba(184,255,61,.07);
    }

    .mode-icon {
      font-size: 26px;
      margin-bottom: 9px;
    }

    .mode-card strong {
      display: block;
      font-size: 17px;
    }

    .mode-card small {
      display: block;
      color: #8f9d94;
      margin-top: 5px;
      line-height: 1.4;
    }

    .options {
      display: none;
      margin-top: 12px;
      padding: 15px;
      border-radius: 18px;
      background: rgba(0,0,0,.2);
      border: 1px solid rgba(255,255,255,.07);
    }

    .options.show {
      display: block;
    }

    .options-title {
      color: #b8ff3d;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .option-btn {
      padding: 12px 5px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.05);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .option-btn:hover {
      background: #b8ff3d;
      color: #07120d;
    }

    .online-note {
      margin-top: 18px;
      padding: 15px;
      border-radius: 18px;
      background: linear-gradient(
        135deg,
        rgba(184,255,61,.10),
        rgba(255,255,255,.03)
      );
      border: 1px solid rgba(184,255,61,.15);
    }

    .online-note strong {
      display: block;
      color: #b8ff3d;
      margin-bottom: 5px;
    }

    .online-note span {
      color: #89978f;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="carrom-page">

    <header class="carrom-header">
      <a class="back-btn" href="index.html">← Back</a>

      <div class="xi-balance">
        <span class="xi-icon">XI</span>
        <strong>0</strong>
      </div>
    </header>

    <section class="carrom-title">
      <span class="eyebrow">PRECISION BOARD GAME</span>

      <h1>
        PLAY<br>
        <span>CARROM.</span>
      </h1>

      <p>
        Choose how you want to play.
        Challenge AI, play with friends locally,
        or compete online.
      </p>
    </section>

    <section class="board-preview">

      <div class="pocket p1"></div>
      <div class="pocket p2"></div>
      <div class="pocket p3"></div>
      <div class="pocket p4"></div>

      <div class="coins">
        <span class="coin-piece black"></span>
        <span class="coin-piece white"></span>
        <span class="coin-piece queen"></span>
        <span class="coin-piece white"></span>
        <span class="coin-piece black"></span>
      </div>

    </section>

    <section class="mode-section">

      <h2>Choose your mode</h2>

      <!-- AI -->
      <button class="mode-card" onclick="toggleOptions('aiOptions')">
        <div class="mode-icon">🤖</div>
        <strong>Play with AI</strong>
        <small>Challenge computer opponents</small>
      </button>

      <div id="aiOptions" class="options">

        <div class="options-title">AI OPPONENTS</div>

        <div class="option-grid">
          <button class="option-btn">1 AI</button>
          <button class="option-btn">2 AI</button>
          <button class="option-btn">3 AI</button>
        </div>

      </div>

      <!-- LOCAL -->
      <button class="mode-card" onclick="toggleOptions('localOptions')">
        <div class="mode-icon">👥</div>
        <strong>Local Multiplayer</strong>
        <small>Play together on the same device</small>
      </button>

      <div id="localOptions" class="options">

        <div class="options-title">PLAYERS</div>

        <div class="option-grid">
          <button class="option-btn">2 Players</button>
          <button class="option-btn">3 Players</button>
          <button class="option-btn">4 Players</button>
        </div>

      </div>

      <!-- ONLINE -->
      <button class="mode-card" onclick="toggleOptions('onlineOptions')">
        <div class="mode-icon">🌐</div>
        <strong>Online Multiplayer</strong>
        <small>Play with players around the world</small>
      </button>

      <div id="onlineOptions" class="options">

        <div class="options-title">ONLINE</div>

        <div class="option-grid">
          <button class="option-btn">Quick Match</button>
          <button class="option-btn">Create Room</button>
          <button class="option-btn">Join Room</button>
        </div>

      </div>

      <div class="online-note">
        <strong>ONLINE MULTIPLAYER</strong>
        <span>
          Multiplayer infrastructure will be connected
          after the complete game UI is ready.
        </span>
      </div>

    </section>

  </main>

  <script>
  // ==========================================
  // MAXGAME CARROM MODE SYSTEM
  // ==========================================

  let selectedMode = null;
  let selectedPlayers = null;
  let selectedDifficulty = null;


  // ==========================================
  // OPEN / CLOSE MODE OPTIONS
  // ==========================================

  function toggleOptions(id) {
    const box = document.getElementById(id);

    document.querySelectorAll(".options").forEach(option => {
      if (option !== box) {
        option.classList.remove("show");
      }
    });

    box.classList.toggle("show");
  }


  // ==========================================
  // CREATE DIFFICULTY PANEL
  // ==========================================

  function showDifficulty(aiCount) {

    const oldPanel =
      document.getElementById("difficultyOptions");

    if (oldPanel) {
      oldPanel.remove();
    }

    selectedMode = "ai";
    selectedPlayers = aiCount;
    selectedDifficulty = null;

    const panel = document.createElement("div");

    panel.id = "difficultyOptions";
    panel.className = "options show";

    panel.innerHTML = `
      <div class="options-title">
        CHOOSE AI DIFFICULTY
      </div>

      <div class="option-grid">

        <button
          class="option-btn difficulty-btn"
          data-difficulty="easy">
          Easy
        </button>

        <button
          class="option-btn difficulty-btn"
          data-difficulty="medium">
          Medium
        </button>

        <button
          class="option-btn difficulty-btn"
          data-difficulty="hard">
          Hard
        </button>

      </div>
    `;

    document
      .getElementById("aiOptions")
      .after(panel);


    panel
      .querySelectorAll(".difficulty-btn")
      .forEach(button => {

        button.addEventListener("click", () => {

          panel
            .querySelectorAll(".difficulty-btn")
            .forEach(btn => {
              btn.style.background = "";
              btn.style.color = "";
            });

          button.style.background = "#b8ff3d";
          button.style.color = "#07120d";

          selectedDifficulty =
            button.dataset.difficulty;

          createStartButton();
        });

      });
  }


  // ==========================================
  // AI PLAYER BUTTONS
  // ==========================================

  document
    .querySelectorAll("#aiOptions .option-btn")
    .forEach((button, index) => {

      button.addEventListener("click", () => {

        const aiCount = index + 1;

        showDifficulty(aiCount);

      });

    });


  // ==========================================
  // LOCAL PLAYER BUTTONS
  // ==========================================

  document
    .querySelectorAll("#localOptions .option-btn")
    .forEach((button, index) => {

      button.addEventListener("click", () => {

        selectedMode = "local";
        selectedPlayers = index + 2;
        selectedDifficulty = null;

        document
          .querySelectorAll("#localOptions .option-btn")
          .forEach(btn => {
            btn.style.background = "";
            btn.style.color = "";
          });

        button.style.background = "#b8ff3d";
        button.style.color = "#07120d";

        createStartButton();

      });

    });


  // ==========================================
  // START BUTTON
  // ==========================================

  function createStartButton() {

    const oldButton =
      document.getElementById("startCarromButton");

    if (oldButton) {
      oldButton.remove();
    }


    const button = document.createElement("button");

    button.id = "startCarromButton";

    button.className = "option-btn";

    button.style.cssText = `
      width:100%;
      margin-top:14px;
      padding:15px;
      border:0;
      border-radius:15px;
      background:#b8ff3d;
      color:#07120d;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 10px 30px rgba(184,255,61,.15);
    `;


    let label = "START CARROM";


    if (selectedMode === "ai") {

      label =
        `START — ${selectedPlayers} AI`;

      if (selectedDifficulty) {
        label +=
          ` • ${selectedDifficulty.toUpperCase()}`;
      }

    }


    if (selectedMode === "local") {

      label =
        `START — ${selectedPlayers} PLAYERS`;

    }


    button.textContent = label;


    if (selectedMode === "ai" && !selectedDifficulty) {
      button.disabled = true;
      button.style.opacity = ".45";
      button.style.cursor = "not-allowed";
    }


    document
      .querySelector(".mode-section")
      .appendChild(button);


    button.addEventListener("click", startCarrom);
  }


  // ==========================================
  // START CARROM
  // ==========================================

  function startCarrom() {

    if (!selectedMode) {
      return;
    }

    if (
      selectedMode === "ai" &&
      !selectedDifficulty
    ) {
      return;
    }


    // Save game configuration
    localStorage.setItem(
      "maxgame_carrom_mode",
      selectedMode
    );

    localStorage.setItem(
      "maxgame_carrom_players",
      String(selectedPlayers)
    );


    if (selectedDifficulty) {

      localStorage.setItem(
        "maxgame_carrom_difficulty",
        selectedDifficulty
      );

    } else {

      localStorage.removeItem(
        "maxgame_carrom_difficulty"
      );

    }


    // Temporary confirmation
    showGameReady();

  }


  // ==========================================
  // GAME READY SCREEN
  // ==========================================

  function showGameReady() {

    const page =
      document.querySelector(".carrom-page");

    const modeText =
      selectedMode === "ai"
        ? "AI GAME"
        : "LOCAL MULTIPLAYER";


    const difficultyText =
      selectedDifficulty
        ? `
          <div>
            Difficulty:
            <strong>
              ${selectedDifficulty.toUpperCase()}
            </strong>
          </div>
        `
        : "";


    page.innerHTML = `

      <header class="carrom-header">

        <button
          class="back-btn"
          id="backToModes"
          type="button">
          ← Back
        </button>

        <div class="xi-balance">
          <span class="xi-icon">XI</span>
          <strong>0</strong>
        </div>

      </header>


      <section
        style="

          display:grid;

        ">

        <div>

          <div
            style="
              width:90px;

          <div
            style="
              margin-top:22px;

              font-size:10px;
              font-weight:900;
              letter-spacing:1.5px;
            ">
            ${modeText}
          </div>


          <h1
            style="
              margin-top:8px;
              font-size:40px;
              line-height:1;
            ">
            CARROM READY
          </h1>


          <div
            style="
              margin-top:18px;
              color:#9aa89f;
              line-height:2;
              font-size:14px;
            ">

            <div>
              Players:
              <strong>
                ${selectedPlayers}
              </strong>
            </div>

            ${difficultyText}

          </div>


          <button

            style="
              margin-top:25px;
              width:100%;

              border:0;

              background:#b8ff3d;
              color:#07120d;
              font-size:14px;
              font-weight:900;
              cursor:pointer;
            ">
            START GAME →
          </button>

        </div>

      </section>
    `;


    document
.getElementById("launchGame")
.addEventListener("click", launchRealCarrom);

    [375,325,"white"],
    [325,375,"white"],
    [375,375,"black"]
  ];

  formation.forEach(p => addPiece(...p));


  function drawBoard() {

    ctx.clearRect(0,0,size,size);

    // Outer wood

    ctx.fillStyle = "#5a3015";
    ctx.fillRect(0,0,size,size);

    // Board

    ctx.fillStyle = "#c58a45";
    ctx.fillRect(
      board.x,
      board.y,
      board.w,
      board.h
    );

    // Playing surface

    ctx.fillStyle = "#e4b76c";

    ctx.fillRect(
      board.x + 28,
      board.y + 28,
      board.w - 56,
      board.h - 56
    );


    // Inner lines

    ctx.strokeStyle = "#8b3e22";
    ctx.lineWidth = 5;

    ctx.strokeRect(
      board.x + 70,
      board.y + 70,
      board.w - 140,
      board.h - 140
    );


    // Center circle

    ctx.beginPath();

    ctx.arc(
      size / 2,
      size / 2,
      58,
      0,
      Math.PI * 2
    );

    ctx.stroke();


    // Center dot

    ctx.beginPath();

    ctx.arc(
      size / 2,
      size / 2,
      7,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#d94b58";
    ctx.fill();


    // Pockets

    pockets.forEach(([x,y]) => {

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        32,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#17100c";
      ctx.fill();

    });


    // Pieces

    pieces.forEach(piece => {

      if (piece.pocketed) return;

      ctx.beginPath();

      ctx.arc(
        piece.x,
        piece.y,
        piece.r,
        0,
        Math.PI * 2
      );

      if (piece.type === "black") {
        ctx.fillStyle = "#171717";
      }

      if (piece.type === "white") {
        ctx.fillStyle = "#f4ead7";
      }

      if (piece.type === "queen") {
        ctx.fillStyle = "#d94b58";
      }

      ctx.fill();

      ctx.strokeStyle = "rgba(0,0,0,.35)";
      ctx.lineWidth = 3;
      ctx.stroke();

    });


    // Striker

    ctx.beginPath();

    ctx.arc(
      striker.x,
      striker.y,
      striker.r,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#f5f5f5";
    ctx.fill();

    ctx.strokeStyle = "#8b3e22";
    ctx.lineWidth = 5;
    ctx.stroke();


    // Aim line

    if (aiming && !striker.moving) {

      ctx.beginPath();

      ctx.moveTo(
        striker.x,
        striker.y
      );

      ctx.lineTo(
        mouseX,
        mouseY
      );

      ctx.strokeStyle =
        "rgba(184,255,61,.8)";

      ctx.lineWidth = 4;
      ctx.setLineDash([12,10]);
      ctx.stroke();
      ctx.setLineDash([]);

    }

  }


  function updatePhysics() {

    let somethingMoving = false;


    pieces.forEach(piece => {

      if (piece.pocketed) return;

      piece.x += piece.vx;
      piece.y += piece.vy;

      piece.vx *= .985;
      piece.vy *= .985;


      if (
        Math.abs(piece.vx) > .05 ||
        Math.abs(piece.vy) > .05
      ) {
        somethingMoving = true;
      }


      const left =
        board.x + 28 + piece.r;

      const right =
        board.x + board.w - 28 - piece.r;

      const top =
        board.y + 28 + piece.r;

      const bottom =
        board.y + board.h - 28 - piece.r;


      if (piece.x < left) {
        piece.x = left;
        piece.vx *= -0.85;
      }

      if (piece.x > right) {
        piece.x = right;
        piece.vx *= -0.85;
      }

      if (piece.y < top) {
        piece.y = top;
        piece.vy *= -0.85;
      }

      if (piece.y > bottom) {
        piece.y = bottom;
        piece.vy *= -0.85;
      }


      // Pocket detection

      pockets.forEach(([px,py]) => {

        const dx = piece.x - px;
        const dy = piece.y - py;

        const distance =
          Math.sqrt(dx*dx + dy*dy);

        if (distance < 30) {

          piece.pocketed = true;

          if (piece.type === "black") {
            score += 10;
          }

          if (piece.type === "white") {
            score += 20;
          }

          if (piece.type === "queen") {
            score += 50;
          }

          document
            .getElementById("playerScore")
            .textContent = score;

        }

      });

    });


    striker.x += striker.vx;
    striker.y += striker.vy;

    striker.vx *= .985;
    striker.vy *= .985;


    if (
      Math.abs(striker.vx) > .05 ||
      Math.abs(striker.vy) > .05
    ) {
      somethingMoving = true;
    }


    const left = board.x + 28 + striker.r;
    const right = board.x + board.w - 28 - striker.r;
    const top = board.y + 28 + striker.r;
    const bottom = board.y + board.h - 28 - striker.r;


    if (striker.x < left) {
      striker.x = left;
      striker.vx *= -0.85;
    }

    if (striker.x > right) {
      striker.x = right;
      striker.vx *= -0.85;
    }

    if (striker.y < top) {
      striker.y = top;
      striker.vy *= -0.85;
    }

    if (striker.y > bottom) {
      striker.y = bottom;
      striker.vy *= -0.85;
    }


    if (!somethingMoving && striker.moving) {

      striker.moving = false;

      resetStriker();

    }

  }


  function resetStriker() {

    striker.x = size / 2;
    striker.y = board.y + board.h - 85;

    striker.vx = 0;
    striker.vy = 0;

    aiming = false;

    timeLeft = 20;

  }


  function shoot() {

    const dx = striker.x - mouseX;
    const dy = striker.y - mouseY;

    const distance =
      Math.sqrt(dx*dx + dy*dy);

    if (distance < 15) return;


    const power =
      Math.min(distance / 8, 18);


    striker.vx =
      (dx / distance) * power;

    striker.vy =
      (dy / distance) * power;

    striker.moving = true;

    aiming = false;

    document
      .getElementById("powerFill")
      .style.width = "0%";

  }


  function pointerPosition(e) {

    const rect =
      canvas.getBoundingClientRect();

    return {

      x:
        (e.clientX - rect.left)
        * size / rect.width,

      y:
        (e.clientY - rect.top)
        * size / rect.height

    };

  }


  canvas.addEventListener(
    "pointerdown",
    e => {

      if (striker.moving) return;

      const p = pointerPosition(e);

      const dx = p.x - striker.x;
      const dy = p.y - striker.y;

      const distance =
        Math.sqrt(dx*dx + dy*dy);

      if (distance < 45) {

        dragging = true;
        aiming = true;

        canvas.setPointerCapture(e.pointerId);

      }

    }
  );


  canvas.addEventListener(
    "pointermove",
    e => {

      if (!dragging) return;

      const p = pointerPosition(e);

      mouseX = p.x;
      mouseY = p.y;


      const dx =
        striker.x - mouseX;

      const dy =
        striker.y - mouseY;

      const distance =
        Math.sqrt(dx*dx + dy*dy);

      const power =
        Math.min(distance / 3, 100);

      document
        .getElementById("powerFill")
        .style.width =
        power + "%";

    }
  );


  canvas.addEventListener(
    "pointerup",
    e => {

      if (!dragging) return;

      dragging = false;

      shoot();

    }
  );


  // 20 second timer

  setInterval(() => {

    if (striker.moving) return;

    timeLeft--;

    document
      .getElementById("gameTimer")
      .textContent = timeLeft;


    if (timeLeft <= 0) {

      resetStriker();

    }

  },1000);


  function gameLoop() {

    updatePhysics();

    drawBoard();

    requestAnimationFrame(gameLoop);

  }


  gameLoop();

}

  }
  </script>
