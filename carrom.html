<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07120d">

  <title>MAXGAME — Carrom</title>

  <link rel="stylesheet" href="css/styles.css">

  <style>
    .carrom-page {
      min-height: 100vh;
      padding: 24px 18px 110px;
    }

    .carrom-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .back-btn {
      text-decoration: none;
      color: #f5f7f4;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 700;
    }

    .xi-balance {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
    }

    .xi-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #b8ff3d;
      color: #07120d;
      font-weight: 900;
    }

    .carrom-title {
      margin-bottom: 22px;
    }

    .carrom-title h1 {
      font-size: clamp(42px, 12vw, 70px);
      line-height: .9;
      margin: 10px 0;
      letter-spacing: -3px;
    }

    .carrom-title h1 span {
      color: #b8ff3d;
    }

    .carrom-title p {
      color: #9aa89f;
      line-height: 1.6;
      margin: 0;
    }

    .board-preview {
      position: relative;
      min-height: 260px;
      margin: 25px 0;
      border-radius: 26px;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.08), transparent 35%),
        linear-gradient(135deg, #9b5e27, #5a3015);
      border: 7px solid #2b160b;
      box-shadow:
        inset 0 0 0 5px #c58a45,
        0 20px 50px rgba(0,0,0,.35);
    }

    .pocket {
      position: absolute;
      width: 34px;
      height: 34px;
      background: #100b07;
      border-radius: 50%;
      box-shadow: inset 0 2px 5px rgba(255,255,255,.1);
    }

    .p1 { top: 12px; left: 12px; }
    .p2 { top: 12px; right: 12px; }
    .p3 { bottom: 12px; left: 12px; }
    .p4 { bottom: 12px; right: 12px; }

    .coins {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .coin-piece {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      box-shadow: 0 3px 7px rgba(0,0,0,.4);
    }

    .black { background: #171717; }
    .white { background: #f0e9dc; }
    .queen { background: #d94b58; }

    .mode-section h2 {
      font-size: 20px;
      margin: 25px 0 14px;
    }

    .mode-grid {
      display: grid;
      gap: 12px;
    }

    .mode-card {
      width: 100%;
      text-align: left;
      padding: 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.045);
      color: #f5f7f4;
      cursor: pointer;
      transition: .2s ease;
    }

    .mode-card:active {
      transform: scale(.98);
    }

    .mode-card:hover {
      border-color: rgba(184,255,61,.4);
      background: rgba(184,255,61,.07);
    }

    .mode-icon {
      font-size: 26px;
      margin-bottom: 9px;
    }

    .mode-card strong {
      display: block;
      font-size: 17px;
    }

    .mode-card small {
      display: block;
      color: #8f9d94;
      margin-top: 5px;
      line-height: 1.4;
    }

    .options {
      display: none;
      margin-top: 12px;
      padding: 15px;
      border-radius: 18px;
      background: rgba(0,0,0,.2);
      border: 1px solid rgba(255,255,255,.07);
    }

    .options.show {
      display: block;
    }

    .options-title {
      color: #b8ff3d;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .option-btn {
      padding: 12px 5px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.05);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .option-btn:hover {
      background: #b8ff3d;
      color: #07120d;
    }

    .online-note {
      margin-top: 18px;
      padding: 15px;
      border-radius: 18px;
      background: linear-gradient(
        135deg,
        rgba(184,255,61,.10),
        rgba(255,255,255,.03)
      );
      border: 1px solid rgba(184,255,61,.15);
    }

    .online-note strong {
      display: block;
      color: #b8ff3d;
      margin-bottom: 5px;
    }

    .online-note span {
      color: #89978f;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="carrom-page">

    <header class="carrom-header">
      <a class="back-btn" href="index.html">← Back</a>

      <div class="xi-balance">
        <span class="xi-icon">XI</span>
        <strong>0</strong>
      </div>
    </header>

    <section class="carrom-title">
      <span class="eyebrow">PRECISION BOARD GAME</span>

      <h1>
        PLAY<br>
        <span>CARROM.</span>
      </h1>

      <p>
        Choose how you want to play.
        Challenge AI, play with friends locally,
        or compete online.
      </p>
    </section>

    <section class="board-preview">

      <div class="pocket p1"></div>
      <div class="pocket p2"></div>
      <div class="pocket p3"></div>
      <div class="pocket p4"></div>

      <div class="coins">
        <span class="coin-piece black"></span>
        <span class="coin-piece white"></span>
        <span class="coin-piece queen"></span>
        <span class="coin-piece white"></span>
        <span class="coin-piece black"></span>
      </div>

    </section>

    <section class="mode-section">

      <h2>Choose your mode</h2>

      <!-- AI -->
      <button class="mode-card" onclick="toggleOptions('aiOptions')">
        <div class="mode-icon">🤖</div>
        <strong>Play with AI</strong>
        <small>Challenge computer opponents</small>
      </button>

      <div id="aiOptions" class="options">

        <div class="options-title">AI OPPONENTS</div>

        <div class="option-grid">
          <button class="option-btn">1 AI</button>
          <button class="option-btn">2 AI</button>
          <button class="option-btn">3 AI</button>
        </div>

      </div>

      <!-- LOCAL -->
      <button class="mode-card" onclick="toggleOptions('localOptions')">
        <div class="mode-icon">👥</div>
        <strong>Local Multiplayer</strong>
        <small>Play together on the same device</small>
      </button>

      <div id="localOptions" class="options">

        <div class="options-title">PLAYERS</div>

        <div class="option-grid">
          <button class="option-btn">2 Players</button>
          <button class="option-btn">3 Players</button>
          <button class="option-btn">4 Players</button>
        </div>

      </div>

      <!-- ONLINE -->
      <button class="mode-card" onclick="toggleOptions('onlineOptions')">
        <div class="mode-icon">🌐</div>
        <strong>Online Multiplayer</strong>
        <small>Play with players around the world</small>
      </button>

      <div id="onlineOptions" class="options">

        <div class="options-title">ONLINE</div>

        <div class="option-grid">
          <button class="option-btn">Quick Match</button>
          <button class="option-btn">Create Room</button>
          <button class="option-btn">Join Room</button>
        </div>

      </div>

      <div class="online-note">
        <strong>ONLINE MULTIPLAYER</strong>
        <span>
          Multiplayer infrastructure will be connected
          after the complete game UI is ready.
        </span>
      </div>

    </section>

  </main>

  <script>
    function toggleOptions(id) {
      const box = document.getElementById(id);

      document.querySelectorAll('.options').forEach(option => {
        if (option !== box) {
          option.classList.remove('show');
        }
      });

      box.classList.toggle('show');
    }
  </script>

</body>
</html>
